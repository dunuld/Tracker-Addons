name: ✨ Feature vorschlagen
description: Eine Idee für eine neue Funktion oder Verbesserung.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Danke für deine Idee! Bitte prüfe vorher, ob es dazu schon ein [offenes Issue](https://github.com/dunuld/hassio-addons/issues) gibt.

  - type: dropdown
    id: addon
    attributes:
      label: Add-on
      description: Für welches Add-on ist der Vorschlag gedacht?
      options:
        - Haushaltsbuch (budget_tracker)
        - ING Depot (ing_depot)
        - Neues Add-on (new_addon)
        - Repository allgemein (Installation, Workflows, Doku)
        - Neues Add-on-Vorschlag
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / Anwendungsfall
      description: Welches Problem soll gelöst werden? Was möchtest du erreichen?
      placeholder: "Ich möchte … , damit …"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Gewünschte Lösung
      description: Wie stellst du dir die Funktion vor?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternativen
      description: Hast du andere Lösungen oder Workarounds in Betracht gezogen?

  - type: textarea
    id: additional
    attributes:
      label: Weitere Informationen
      description: Mockups, Screenshots, Beispiele oder Links.

  - type: checkboxes
    id: contribution
    attributes:
      label: Mitwirken
      options:
        - label: Ich würde bei der Umsetzung helfen (siehe [CONTRIBUTING.md](https://github.com/dunuld/hassio-addons/blob/main/CONTRIBUTING.md)).
          required: false
